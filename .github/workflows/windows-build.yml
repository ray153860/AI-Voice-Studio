name: Windows Build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[build]'
      - name: Build one-folder application
        run: >-
          pyinstaller --noconfirm --clean --onedir
          --name AI-Voice-Studio
          --collect-all soundfile
          --collect-all uvicorn
          --collect-all fastapi
          src/voice_studio/launcher.py
      - name: Smoke test packaged API
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/AI-Voice-Studio/AI-Voice-Studio.exe" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765/api/capabilities" -UseBasicParsing
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $ready) { throw "Packaged API did not become ready" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Voice-Studio-windows-unsigned
          path: dist/AI-Voice-Studio/
          if-no-files-found: error
