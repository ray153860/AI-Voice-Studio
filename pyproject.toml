[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-voice-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "numpy>=1.26", "soundfile>=0.12", "python-multipart>=0.0.9", "httpx>=0.27"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.11"]
security = ["bandit>=1.8", "pip-audit>=2.9"]
[project.scripts]
ai-voice-studio = "voice_studio.launcher:main"
[tool.setuptools.packages.find]
where = ["src"]
